<style>
:root{--bg:#eef2f6;--sf:#fff;--ink:#14202e;--mu:#5d6b7a;--ln:#d6dde5;--ac:#1f6feb;--soft:#e3edff;--bad:#c92a2a;--ok:#2b8a3e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--sf:#18222e;--ink:#eaf0f6;--mu:#9aa8b6;--ln:#2b3846;--soft:#1b2a40;--bad:#ff6b6b;--ok:#51cf66}}
:root[data-theme="dark"]{--bg:#0f1720;--sf:#18222e;--ink:#eaf0f6;--mu:#9aa8b6;--ln:#2b3846;--soft:#1b2a40;--bad:#ff6b6b;--ok:#51cf66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Kufi Arabic",Tahoma,sans-serif;line-height:1.7}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
nav button{flex:1 0 auto;font:inherit;padding:10px 14px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chips button{font:inherit;padding:6px 14px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;cursor:pointer}.chips button[aria-pressed="true"]{background:var(--ac);color:#fff;border-color:var(--ac)}.bar{height:8px;background:var(--ac);border-radius:4px;min-width:2px}.hero{display:flex;gap:14px;align-items:center;border-radius:18px;padding:18px;color:#fff;margin-bottom:14px;background:linear-gradient(135deg,var(--h1),var(--h2))}
.hero .hi{font-size:38px;line-height:1;background:rgba(255,255,255,.2);border-radius:16px;padding:10px}
.hero b{font-size:18px;display:block}.hero span{opacity:.93;font-size:14px}
.st-ok{--h1:#2b8a3e;--h2:#1c6b5a}.st-warn{--h1:#e8590c;--h2:#c2410c}.st-bad{--h1:#c92a2a;--h2:#8f1d1d}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;text-align:center}
.tile strong{display:block;font-size:22px;color:var(--ac)}.tile small{color:var(--mu)}
.act{display:flex;gap:14px;align-items:flex-start;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
.act .ai{font-size:26px;width:52px;height:52px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.act h3{margin:0 0 4px;font-size:16px}.act p{margin:0 0 10px;color:var(--mu);font-size:13px}
.bnr{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff1e6;background:color-mix(in srgb,#e8590c 14%,var(--sf));color:var(--ink);border:1px solid #e8590c;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.lockw{max-width:440px;margin:7vh auto;padding:16px}.pl{display:block;padding:5px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
h2{font-size:16px;margin:0 0 10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}
.row{display:flex;gap:8px;margin-bottom:8px}
.btn{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.g{background:var(--soft);color:var(--ac)}
.btn.r{background:transparent;color:var(--bad);padding:4px 8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--ln)}
th{color:var(--mu);font-size:12px;font-weight:600}
.low{color:var(--bad);font-weight:600}.ok{color:var(--ok);font-weight:600}.warn{color:#e67700;font-weight:600}.bt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px}
.stat small{color:var(--mu);display:block;font-size:12px}
.stat strong{font-size:20px;color:var(--ac)}
.mu{color:var(--mu);font-size:13px}
.inv{border:1px dashed var(--ln);border-radius:10px;padding:12px;margin-top:10px}
#lblprint{display:none}@media print{body.plbl>*:not(#lblprint){display:none!important}body.plbl #lblprint{display:block!important}body.plbl #lblprint,body.plbl #lblprint *{visibility:visible}body *{visibility:hidden}.inv,.inv *{visibility:visible}.inv{position:absolute;top:0;left:0;right:0;border:0}}
</style>

<body>
<main id="app" style="display:none">
<h1>🛒 سیستەمێ دوکانێ</h1>
<div id="ubar"></div>
<div id="bk"></div>
<nav id="nav"></nav>
<div id="v"></div>
</main>
<div id="lockscr" style="display:none"></div>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const LOW=5;
function toast(m,bad){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:2147483000;color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;white-space:pre-wrap;box-shadow:0 6px 24px rgba(0,0,0,.35);cursor:pointer';e.onclick=function(){e.style.display='none'};document.body.appendChild(e)}
e.style.background=bad?'#c92a2a':'#14202e';e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none'},7000)}
try{window.alert=function(m){toast(String(m))};window.addEventListener('error',function(ev){toast('هەلە: '+(ev.message||''),true)});window.addEventListener('unhandledrejection',function(ev){toast('هەلە: '+((ev.reason&&ev.reason.message)||ev.reason),true)})}catch(e){}

let cfSet={};
function cfKey(msg,args){return msg+'|'+Array.prototype.map.call(args||[],function(a){a=String(a);return a.slice(0,60)+':'+a.length}).join(',')}
function cf(msg,fn,args){
 if(window.__cfAuto)return window.__cfAuto(msg);
 var k=cfKey(msg,args);if(cfSet[k]&&Date.now()-cfSet[k]<30000){delete cfSet[k];return true}
 uiAsk(msg,function(){cfSet[k]=Date.now();try{fn.apply(null,args)}catch(e){toast('هەلە: '+(e&&e.message?e.message:e),true)}});return false}
function uiModal(msg,withInput,yesTxt,yes){
 var o=document.getElementById('cfmod');if(o)o.parentNode.removeChild(o);
 o=document.createElement('div');o.id='cfmod';o.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483200;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px';
 var c=document.createElement('div');c.style.cssText='background:var(--sf,#fff);color:var(--ink,#14202e);border-radius:16px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)';
 var t=document.createElement('div');t.style.cssText='white-space:pre-wrap;line-height:1.8;font-size:16px;margin-bottom:12px';t.textContent=msg;c.appendChild(t);
 var inp=null;if(withInput){inp=document.createElement('input');inp.id='cfinp';inp.style.cssText='margin-bottom:12px';c.appendChild(inp)}
 var r=document.createElement('div');r.style.cssText='display:flex;gap:8px';
 var y=document.createElement('button');y.className='btn';y.textContent=yesTxt;var n=document.createElement('button');n.className='btn g';n.textContent='ڕاکرن';
 y.onclick=function(){var v=inp?inp.value:null;o.parentNode.removeChild(o);yes(v)};n.onclick=function(){o.parentNode.removeChild(o)};
 r.appendChild(y);r.appendChild(n);c.appendChild(r);o.appendChild(c);document.body.appendChild(o);if(inp&&inp.focus)inp.focus()}
function uiAsk(msg,yes){uiModal(msg,false,'✓ بەلێ',function(){yes()})}
function uiPrompt(msg,yes){if(window.__cfAuto&&window.__promptAuto!==undefined)return yes(window.__promptAuto);uiModal(msg,true,'زێدەکرن',yes)}
let IDB=null,storeLoaded=false,prevFlag=false;
let saveErr=false;let S={products:[],sales:[]};
try{const x=localStorage.getItem('shop');if(x)S=JSON.parse(x)}catch(e){}
S.products.forEach(p=>{if(!p.batches)p.batches=p.stock>0?[{id:1,qty:p.stock,exp:''}]:[]});
if(!S.returns)S.returns=[];if(!S.customers)S.customers=[];if(!S.ledger)S.ledger=[];if(!S.cash)S.cash=[];if(!S.expenses)S.expenses=[];if(!S.closings)S.closings=[];if(!S.expCats)S.expCats=[];if(!S.holds)S.holds=[];if(!S.suppliers)S.suppliers=[];if(!S.purchases)S.purchases=[];if(!S.sledger)S.sledger=[];if(!S.lbl)S.lbl={size:'50x30',name:1,price:1,code:1,shop:0};if(S.shopName==null)S.shopName='';if(!S.arch)S.arch={months:{}};
function newCode(){const n=S.products.map(p=>/^P\d+$/.test(p.code||'')?parseInt(p.code.slice(1)):0);return 'P'+(Math.max(1000,...n)+1)}
S.products.forEach(p=>{if(!p.code)p.code=newCode()});
function sync(p){p.stock=p.batches.reduce((a,b)=>a+b.qty,0)}
function dl(e){return Math.round((new Date(e+'T00:00:00')-new Date(new Date().toDateString()))/864e5)}
function avail(p){return p.batches.reduce((a,b)=>a+((b.exp&&dl(b.exp)<0)?0:b.qty),0)}
function save(k){if(!k)S.dirty=(S.dirty||0)+1;try{persist()}catch(e){saveErr=true}if(saveErr){try{bannerUI()}catch(x){}}try{clSoon()}catch(x){}}
let tab='sell',cart=[],last=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>Math.round(n).toLocaleString('en')+' د.ع';
const tabs=[['sell','فرۆتن'],['prod','بەرهەم'],['stock','ستۆک'],['rep','ڕاپۆرت'],['data','داتا']];
function nav(){$('nav').innerHTML=tabsFor().map(t=>'<button aria-pressed="'+(tab===t[0])+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>').join('')}
function go(t){stopScan();editId=null;eb=null;ue=null;recShow=null;cdet=null;cfm=null;cpay=null;climId=null;hdet=null;clsDone=null;sdet=null;sfm=null;pdet=null;spay=null;tab=t;render()}
function render(){document.body.classList.remove('plbl');if(!curU)return;const ts=tabsFor();if(!ts.some(t=>t[0]===tab))tab=ts.length?ts[0][0]:'none';nav();userBar();bannerUI();
if(tab==='none'){$('v').innerHTML='<div class="card"><p>هیچ ڕێپێدانەک بۆ تە نەهاتیە دانان. ب خودان دوکانێ بێژە.</p></div>';return}
try{({sell,prod,stock,rep,data:dataTab,usr:usersTab,cust:custTab,cash:cashTab,sup:supTab,lbl:lbTab})[tab]()}catch(e){$('v').innerHTML='<div class="card"><h2 class="low">⚠ هەلەیەک ل ڤی بەشی</h2><p class="mu">'+esc(e&&e.message?e.message:e)+'</p><p class="mu">ڤێنەیەکا ڤێ پەیامێ بۆ من بنێرە.</p></div>'}}

function bcost(p,b){return b.cost!=null?b.cost:(p.cost!=null?p.cost:null)}
function consume(p,q){let r=q,cs=0,unk=false;
p.batches.sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999'));
for(const b of p.batches){if(b.exp&&dl(b.exp)<0)continue;const t=Math.min(b.qty,r);if(t>0){const c=bcost(p,b);if(c==null)unk=true;else cs+=c*t}b.qty-=t;r-=t;if(!r)break}
p.batches=p.batches.filter(b=>b.qty>0);sync(p);return(unk||q<=0)?null:cs/q}
function mgText(price,cost){if(isNaN(price)||isNaN(cost))return '';const pr=price-cost,pc=price>0?Math.round(pr/price*1000)/10:0;return pr<0?'<span class="low">⚠ بها ژ بهایێ کڕینێ کێمترە: '+m(pr)+'</span>':'قازانجا هەر دانەیەکێ: '+m(pr)+' ('+pc+'٪)'}
function mgUpd(){const e=$('mg');if(!e)return;const c=$('pc');e.innerHTML=c?mgText(parseFloat($('p').value),parseFloat(c.value)):''}
function profitCard(pr,rk,ck,rtot,pp,ex){ex=ex||0;const cov=rtot>0?Math.round(rk/rtot*100):100,mg=rk>0?Math.round(pr/rk*1000)/10:0,net=pr-ex;
const rows=Object.entries(pp).sort((a,b)=>(b[1].r-b[1].c)-(a[1].r-a[1].c)).slice(0,10);
return '<div class="card"><h2>💰 قازانج</h2><div class="stats"><div class="stat"><small>قازانجا کالا</small><strong class="'+(pr<0?'low':'')+'">'+m(pr)+'</strong></div><div class="stat"><small>سەدی قازانجێ</small><strong>'+mg+'٪</strong></div><div class="stat"><small>بهایێ کڕینا فرۆتی</small><strong>'+m(ck)+'</strong></div></div>'+
'<div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><small>خەرجی</small><strong class="low">'+m(ex)+'</strong></div><div class="stat"><small>قازانجا پاک پشتی خەرجیان</small><strong class="'+(net<0?'low':'ok')+'">'+m(net)+'</strong></div></div>'+
(cov<100?'<p class="warn" style="margin:0 0 8px">⚠ تنێ '+cov+'٪ ژ فرۆتنێ بهایێ کڕینێ هەیە. بۆ بەرهەمێن بێ بهایێ کڕینێ، ل بەشێ بەرهەمان بهایێ کڕینێ بنڤیسە.</p>':'')+(rows.length?'<div class="wrap"><table><thead><tr><th>بەرهەم</th><th>چەند</th><th>فرۆتن</th><th>قازانج</th></tr></thead><tbody>'+rows.map(e=>'<tr><td>'+esc(e[0])+'</td><td>'+e[1].q+'</td><td>'+m(e[1].r)+'</td><td class="'+(e[1].r-e[1].c<0?'low':'ok')+'">'+m(e[1].r-e[1].c)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="mu">هێشتا داتایا بهایێ کڕینێ نینە.</p>')+'</div>'}
let editId=null;
function prod(){
const ed=editId?S.products.find(x=>x.id===editId):null;if(editId&&!ed)editId=null;
const form=ed?
'<div class="card"><h2>گۆڕینا بەرهەمی</h2><div class="row"><input id="b" value="'+esc(ed.code||'')+'" placeholder="بارکۆد / کۆد" onkeydown="kd(event)"><button class="btn g" onclick="scan()">📷 سکانکرن</button></div><div id="rd"></div><div class="row"><input id="n" value="'+esc(ed.name)+'" placeholder="ناڤێ بەرهەمی"><input id="p" type="number" min="0" step="any" value="'+ed.price+'" placeholder="بها" oninput="mgUpd()">'+(can('cost')?'<input id="pc" type="number" min="0" step="any" value="'+(ed.cost!=null?ed.cost:'')+'" placeholder="بهایێ کڕینێ" oninput="mgUpd()">':'')+'</div>'+(can('cost')?'<div id="mg" class="mu"></div>':'')+'<p class="mu">چەندیا ستۆکێ و دەمێ بەسەرچوونێ ل بەشێ <b>ستۆک</b> دهێنە گۆڕین. فاتورێن کۆن ناهێنە گۆڕین.</p><button class="btn" onclick="saveP()">پاشەکەفتکرن</button> <button class="btn g" onclick="cancelP()">ڕاکرن</button></div>':
'<div class="card"><h2>بەرهەمەکێ نوی زێدە بکە</h2><div class="row"><input id="b" placeholder="بارکۆد / کۆد (ب دەست یان ب سکانکرنێ)" onkeydown="kd(event)"><button class="btn g" onclick="scan()">📷 سکانکرن</button></div><div id="rd"></div><div class="row"><input id="n" placeholder="ناڤێ بەرهەمی"><input id="p" type="number" min="0" step="any" placeholder="بها" oninput="mgUpd()">'+(can('cost')?'<input id="pc" type="number" min="0" step="any" placeholder="بهایێ کڕینێ" oninput="mgUpd()">':'')+'<input id="q" type="number" min="0" placeholder="چەند"><input id="e" type="date" aria-label="دەمێ بەسەرچوونێ" title="دەمێ بەسەرچوونێ"></div>'+(can('cost')?'<div id="mg" class="mu"></div>':'')+'<p class="mu">دەمێ بەسەرچوونێ (ئارەزوومەندانە): دەمێ باتچا یەکەمە</p><button class="btn" onclick="addP()">زێدەکرن</button></div>';
$('v').innerHTML=((ed&&!can('prodEdit'))||(!ed&&!can('prodAdd'))?'':form)+
'<div class="card"><h2>هەمی بەرهەم ('+S.products.length+')</h2>'+(can('cost')&&S.products.some(p=>p.cost==null)?'<p class="warn" style="margin:0 0 8px">⚠ '+S.products.filter(p=>p.cost==null).length+' بەرهەم بێ بهایێ کڕینێ نە (قازانج بۆ وان نایێتە حیسابکرن).</p>':'')+(S.products.length?'<div class="wrap"><table><thead><tr><th>کۆد</th><th>بەرهەم</th>'+(can('cost')?'<th>کڕین</th>':'')+'<th>بها</th>'+(can('cost')?'<th>قازانج</th>':'')+'<th>ماین</th><th></th></tr></thead><tbody>'+
S.products.map(p=>'<tr'+(p.id===editId?' style="background:var(--soft)"':'')+'><td class="mu">'+(p.code?esc(p.code):'—')+'</td><td>'+esc(p.name)+'</td>'+(can('cost')?'<td class="mu">'+(p.cost!=null?m(p.cost):'—')+'</td>':'')+'<td>'+m(p.price)+'</td>'+(can('cost')?'<td class="'+(p.cost!=null&&p.price<p.cost?'low':'')+'">'+(p.cost!=null?m(p.price-p.cost)+' ('+(p.price>0?Math.round((p.price-p.cost)/p.price*1000)/10:0)+'٪)':'—')+'</td>':'')+'<td>'+p.stock+'</td><td>'+(can('prodEdit')?'<button class="btn g" onclick="editP('+p.id+')">گۆڕین</button> ':'')+(can('prodDel')?'<button class="btn r" onclick="delP('+p.id+')">ژێبرن</button>':'')+'</td></tr>').join('')+
'</tbody></table></div>':'<p class="mu">هێشتا بەرهەم نینن. یەکەم بەرهەم زێدە بکە.</p>')+'</div>';mgUpd()}
function editP(id){if(!can('prodEdit'))return deny();stopScan();editId=id;prod();window.scrollTo({top:0,behavior:'smooth'})}
function cancelP(){stopScan();editId=null;prod()}
function saveP(){if(!can('prodEdit'))return deny();const p=S.products.find(x=>x.id===editId);if(!p)return;
const code=$('b').value.trim()||p.code,name=$('n').value.trim(),price=parseFloat($('p').value);
if(!name||isNaN(price)||price<0)return alert('ناڤ و بها پڕ بکە');
if(S.products.some(x=>x.id!==p.id&&x.code===code))return alert('ئەڤ کۆدە بەری نوکە بۆ بەرهەمەکێ دی هاتیە تۆمارکرن');
let nc=p.cost==null?null:p.cost;if(can('cost')&&$('pc')){const v=$('pc').value;nc=v===''?null:parseFloat(v);if(nc!=null&&(isNaN(nc)||nc<0))return alert('بهایێ کڕینێ دروست بنڤیسە');if(nc!=null&&price<nc&&!cf('بها ژ بهایێ کڕینێ کێمترە. بەردەوام؟',arguments.callee,arguments))return}

const perms={};if(role==='staff')PERMS.forEach(p=>{if($('pm_'+p[0]).checked)perms[p[0]]=true});
let md=parseFloat($('umd').value);if(isNaN(md))md=nu?10:100;md=Math.max(0,Math.min(100,md));const maxDisc=role==='staff'?md:null;

else{if(pin){u.salt=rndHex(16);u.hash=await hp(pin,u.salt)}u.name=name;u.role=role;u.perms=perms;u.maxDisc=maxDisc;u.active=active;logA('گۆڕینا ئەندامی: '+name+(pin?' (PIN)':''))}

let cq='',cdet=null,cfm=null,cpay=null,showArch=false,cflt='debt',climId=null;
function nd(s){return String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))}
function custName(id){const c=S.customers.find(x=>x.id===id);return c?c.name:'—'}
function custBal(id){let b=0;S.ledger.forEach(x=>{if(x.cid===id)b+=x.amt});return Math.round(b*100)/100}
function custAge(id){const L=S.ledger.filter(x=>x.cid===id).sort((a,b)=>a.t-b.t);let paid=0;L.forEach(x=>{if(x.amt<0)paid+=-x.amt});
for(const x of L){if(x.amt>0){if(paid>=x.amt-0.5)paid-=x.amt;else return Math.floor((Date.now()-x.t)/864e5)}}return null}
function custTotalDebt(){const g={};S.ledger.forEach(x=>{g[x.cid]=(g[x.cid]||0)+x.amt});return Object.keys(g).reduce((a,k)=>a+(g[k]>0.5?g[k]:0),0)}
function waLink(c,bal){let p=nd(c.phone).replace(/[^\d]/g,'');if(!p)return '';if(p.indexOf('00')===0)p=p.slice(2);else if(p.charAt(0)==='0')p='964'+p.slice(1);
return 'https://wa.me/'+p+'?text='+encodeURIComponent('سڵاڤ '+c.name+'، قەرزێ تە ل دوکانێ '+m(bal)+' یە. سوپاس.')}
function ledLabel(x){let t='';
if(x.type==='sale')t='فاتورە #'+x.saleId;
else if(x.type==='pay')t='پارەدان'+((x.cur&&x.cur!=='IQD')?' ('+fc(x.recv,x.cur)+')':'');
else if(x.type==='ret')t='زڤڕاندنا بەرهەمان (فاتورە #'+x.saleId+')';
else t='ڕاستکرن'+(x.note?': '+esc(x.note):'');
return t+(x.by?' <span class="mu">· 👤 '+esc(x.by.n)+'</span>':'')}
function ledAdd(o){S.ledger.push(Object.assign({id:'l'+Date.now()+Math.floor(Math.random()*1000),t:Date.now(),by:curU?{id:curU.id,n:curU.name}:null},o))}
function cState(c,b){const l=c.limit>0?c.limit:0;if(!l||b<=0.5)return 'ok';return b>=l?'over':(b/l>=0.8?'near':'ok')}
function cRows(){const q=nd(cq).trim().toLowerCase();return S.customers.filter(c=>{if(!showArch&&c.archived)return false;
if(q)return c.name.toLowerCase().indexOf(q)>=0||nd(c.phone).indexOf(q)>=0;
const b=custBal(c.id);return cflt==='all'?true:cflt==='debt'?b>0.5:cState(c,b)===cflt}).map(c=>({c,b:custBal(c.id),a:custAge(c.id)})).sort((x,y)=>y.b-x.b||x.c.name.localeCompare(y.c.name))}
function cCounts(){const o={debt:0,all:0,near:0,over:0};S.customers.forEach(c=>{if(c.archived)return;const b=custBal(c.id),st=cState(c,b);o.all++;if(b>0.5)o.debt++;if(st==='near')o.near++;if(st==='over')o.over++});return o}
function limInfo(c,b){if(!(c.limit>0))return '<div class="mu">سنوورێ قەرزی: بێ سنوور</div>';const l=c.limit,pc=Math.max(0,Math.min(100,Math.round(Math.max(b,0)/l*100))),st=cState(c,b),col=st==='over'?'var(--bad)':st==='near'?'#e67700':'var(--ac)',left=l-Math.max(b,0);
return '<div class="mu">سنوورێ قەرزی: <b>'+m(l)+'</b> · '+(left>0.5?'ماوە: <b>'+m(left)+'</b>':'<span class="low">گەهشتیە سنوور'+(left<-0.5?' · زێدەتر ب '+m(-left):'')+'</span>')+'</div><div style="height:7px;border-radius:4px;background:var(--ln);margin:4px 0"><div style="height:7px;border-radius:4px;width:'+pc+'%;background:'+col+'"></div></div>'}
function cListHTML(rows){const q=nd(cq).trim();
if(!rows.length)return '<p class="mu">'+(q?'کڕیار نەهاتە دیتن.':cflt==='debt'?'هیچ کڕیارەک قەرز نینە ✓':cflt==='all'?'هێشتا کڕیار نینن.':'کڕیار نینن ل ڤێ پۆلێ.')+'</p>';
const tot=rows.reduce((a,r)=>a+(r.b>0.5?r.b:0),0);
return '<div class="inv"><b>لیستا قەرزداران</b> <span class="mu">'+new Date().toLocaleDateString('en-GB')+' · '+rows.filter(r=>r.b>0.5).length+' کەس · کۆم: '+m(tot)+'</span></div>'+rows.map(r=>{const c=r.c,b=r.b,st=cState(c,b);
return '<div class="inv" style="margin-top:8px'+(st==='over'?';border-color:var(--bad)':'')+'"><div class="row" style="justify-content:space-between;align-items:center;margin:0"><b>'+esc(c.name)+(c.archived?' <span class="mu">(ڕاگرتی)</span>':'')+'</b><span class="'+(b>0.5?'low':'mu')+'" style="font-weight:800;font-size:18px">'+m(b)+'</span></div>'+
'<div class="mu">'+(c.phone?'📞 '+esc(c.phone)+' · ':'')+(r.a!=null&&b>0.5?'کۆنترین: '+r.a+' ڕۆژ':'')+'</div>'+
(climId===c.id?'<div class="row" style="margin:6px 0"><input id="cli" type="number" min="0" step="any" value="'+(c.limit||'')+'" placeholder="سنوور ب د.ع (چۆل = بێ سنوور)" aria-label="سنوور"><button class="btn" onclick="cLimSave(\''+c.id+'\')">پاشەکەفت</button><button class="btn g" onclick="climId=null;cListUpd()">ڕاکرن</button></div>':limInfo(c,b))+
'<div class="row" style="flex-wrap:wrap;margin:6px 0 0"><button class="btn g" onclick="cOpen(\''+c.id+'\')">کەشف</button>'+(can('debtPay')&&b>0.5?'<button class="btn g" onclick="cOpen(\''+c.id+'\')">💵 وەرگرتن</button>':'')+(can('custEdit')&&climId!==c.id?'<button class="btn g" onclick="cLim(\''+c.id+'\')">🏷️ سنوور</button>':'')+'</div></div>'}).join('')}
function cLim(id){if(!can('custEdit'))return deny();climId=id;cListUpd();const i=$('cli');if(i&&i.focus)i.focus()}
function cLimSave(id){if(!can('custEdit'))return deny();const c=S.customers.find(x=>x.id===id);if(!c)return;const v=$('cli').value,lim=v===''?null:parseFloat(v);
if(lim!=null&&(isNaN(lim)||lim<0))return alert('سنوورێ قەرزی دروست بنڤیسە');
const b=custBal(id);if(lim!=null&&lim>0&&b>lim+0.5&&!cf('قەرزێ نوکە ('+m(b)+') ژ سنوورێ نوی زێدەترە. بەردەوام؟',arguments.callee,arguments))return;
if((c.limit||null)!==lim)logA('سنوورێ قەرزی: '+c.name+' → '+(lim==null?'بێ سنوور':lim));c.limit=lim;climId=null;save();render()}
function cListUpd(){const e=$('cls');if(e)e.innerHTML=cListHTML(cRows())}
function custTab(){
if(!(can('custView')||can('custEdit')||can('debtPay')))return deny();
if(cdet){const c=S.customers.find(x=>x.id===cdet);if(c)return custDet(c);cdet=null}
const cn=cCounts(),td=custTotalDebt();
$('v').innerHTML=(cfm?cForm():'')+
'<div class="stats"><div class="stat"><small>کۆمێ قەرزان</small><strong class="'+(td>0?'low':'')+'">'+m(td)+'</strong></div><div class="stat"><small>کەسێن ب قەرز</small><strong>'+cn.debt+'</strong></div><div class="stat"><small>نێزیکی/زێدەتر ژ سنوور</small><strong class="'+(cn.near+cn.over>0?'warn':'')+'">'+(cn.near+cn.over)+'</strong></div></div>'+
'<div class="chips">'+[['debt','📒 ب قەرز',cn.debt],['near','⚠ نێزیکی سنوور',cn.near],['over','⛔ گەهشتیە سنوور',cn.over],['all','هەمی',cn.all]].map(x=>'<button aria-pressed="'+(cflt===x[0])+'" onclick="cflt=\''+x[0]+'\';climId=null;render()">'+x[1]+' ('+x[2]+')</button>').join('')+'</div>'+
'<div class="card"><div class="row"><input id="cqi" value="'+esc(cq)+'" placeholder="گەڕیان (هەمی کڕیاران): ناڤ یان تەلەفون" oninput="cq=this.value;cListUpd()" autocomplete="off">'+(can('custEdit')?'<button class="btn" onclick="cNew()">＋ نوی</button>':'')+'</div><div id="cls">'+cListHTML(cRows())+'</div>'+
'<div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn g" onclick="window.print()">🖨️ چاپکرنا لیستێ</button>'+(S.customers.some(c=>c.archived)?'<label class="pl"><input type="checkbox" '+(showArch?'checked':'')+' onchange="showArch=this.checked;render()" style="width:auto"> کڕیارێن ڕاگرتی ژی</label>':'')+'</div></div>'}
function cNew(){if(!can('custEdit'))return deny();cfm='new';render()}
function cEdit(id){if(!can('custEdit'))return deny();cfm=id;render()}
function cForm(){const nu=cfm==='new',c=nu?{name:'',phone:'',note:'',limit:''}:S.customers.find(x=>x.id===cfm);if(!c){cfm=null;return ''}
return '<div class="card"><h2>'+(nu?'کڕیارەکێ نوی':'گۆڕینا کڕیاری')+'</h2><input id="cn_n" value="'+esc(c.name)+'" placeholder="ناڤ" style="margin-bottom:8px" autocomplete="off"><input id="cn_p" value="'+esc(c.phone||'')+'" placeholder="ژمارا تەلەفونێ (ئارەزوومەندانە)" inputmode="tel" style="margin-bottom:8px" autocomplete="off"><input id="cn_l" type="number" min="0" step="any" value="'+(c.limit||'')+'" placeholder="سنوورێ قەرزی ب د.ع (چۆل = بێ سنوور)" style="margin-bottom:8px"><input id="cn_t" value="'+esc(c.note||'')+'" placeholder="تێبینی" style="margin-bottom:8px" autocomplete="off"><div class="row"><button class="btn" onclick="cSave()">پاشەکەفتکرن</button><button class="btn g" onclick="cfm=null;render()">ڕاکرن</button></div></div>'}
function cSave(){if(!can('custEdit'))return deny();
const nu=cfm==='new',c=nu?null:S.customers.find(x=>x.id===cfm);if(!nu&&!c)return;
const name=$('cn_n').value.trim(),phone=nd($('cn_p').value).trim(),lv=$('cn_l').value,lim=lv===''?null:parseFloat(lv),note=$('cn_t').value.trim();
if(!name)return alert('ناڤ بنڤیسە');
if(lim!=null&&(isNaN(lim)||lim<0))return alert('سنوورێ قەرزی دروست بنڤیسە');
if(phone&&S.customers.some(x=>x!==c&&nd(x.phone)===phone))return alert('ئەڤ ژمارە تەلەفونێ بۆ کڕیارەکێ دی هاتیە تۆمارکرن');
if(nu){S.customers.push({id:'c'+Date.now(),name,phone,note,limit:lim,created:Date.now()});logA('کڕیارەکێ نوی: '+name)}
else{if(c.limit!==lim)logA('سنوورێ قەرزی: '+c.name+' → '+(lim==null?'بێ سنوور':lim));c.name=name;c.phone=phone;c.note=note;c.limit=lim;logA('گۆڕینا کڕیاری: '+name)}
cfm=null;save();render()}
function cOpen(id){cdet=id;cpay={cur:'IQD',recv:'',gave:false};render();window.scrollTo&&window.scrollTo({top:0})}
function cBack(){cdet=null;cpay=null;render()}
function custDet(c){const b=custBal(c.id),age=custAge(c.id);
const L=S.ledger.filter(x=>x.cid===c.id).sort((a,b2)=>a.t-b2.t);let run=0;const rows=L.map(x=>{run+=x.amt;return {x,run}}).reverse().map(r=>'<tr><td class="mu">'+new Date(r.x.t).toLocaleString('en-GB')+'</td><td>'+ledLabel(r.x)+'</td><td class="'+(r.x.amt>0?'low':'ok')+'">'+(r.x.amt>0?'+':'−')+m(Math.abs(r.x.amt))+'</td><td>'+m(r.run)+'</td></tr>').join('');
const wa=(b>0.5&&c.phone)?waLink(c,b):'';
$('v').innerHTML=(cfm?cForm():'')+
'<div class="card"><button class="btn g" onclick="cBack()">← کڕیار</button><h2 style="margin-top:10px">👤 '+esc(c.name)+(c.archived?' <span class="mu">(ڕاگرتی)</span>':'')+'</h2>'+(c.phone?'<div class="mu">📞 '+esc(c.phone)+'</div>':'')+(c.note?'<div class="mu">'+esc(c.note)+'</div>':'')+limInfo(c,b)+
'<div style="font-size:26px;font-weight:800;margin:8px 0" class="'+(b>0.5?'low':'ok')+'">'+(b>0.5?'قەرز: '+m(b):b<-0.5?'پارە ل سەر دوکانێ: '+m(-b):'قەرز نینە ✓')+'</div>'+(age!=null&&b>0.5?'<div class="warn">کۆنترین قەرز: '+age+' ڕۆژ</div>':'')+
'<div class="row" style="margin-top:10px;flex-wrap:wrap">'+(wa?'<a class="btn g" style="text-decoration:none" href="'+wa+'" target="_blank" rel="noopener">📲 بیرئینان</a>':'')+'<button class="btn g" onclick="window.print()">🖨️ کەشفا حسابی</button>'+(can('custEdit')?'<button class="btn g" onclick="cEdit(\''+c.id+'\')">گۆڕین</button>':'')+(isOwner()?'<button class="btn r" onclick="cArch(\''+c.id+'\')">'+(c.archived?'ڤەگەڕاندن':(L.length?'ڕاگرتن':'ژێبرن'))+'</button>':'')+'</div></div>'+
(can('debtPay')&&b>0.5?dpCard(c):'')+
(isOwner()?'<div class="card"><h2>ڕاستکرنا قەرزی (خودان)</h2><p class="mu">بۆ ڕاستکرنا خەلەتیەکێ یان هەلوەشاندنا قەرزەکێ. نیشانا − ب کێمکرنێ.</p><div class="row"><input id="aj_a" type="number" step="any" placeholder="چەند (مثلا -5000 یان 2000)"><input id="aj_n" placeholder="هۆکار (پێدڤییە)"></div><button class="btn g" onclick="adjDone(\''+c.id+'\')">ڕاستکرن</button></div>':'')+
'<div class="card"><h2>کەشفا حسابی</h2><div class="inv">'+(rows?'<div class="wrap"><table><thead><tr><th>دەم</th><th>چ هاتیە کرن</th><th>چەند</th><th>قەرز پشتی وێ</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<p class="mu">هێشتا چ نینە.</p>')+'</div></div>'}
function cArch(id){if(!isOwner())return deny();const c=S.customers.find(x=>x.id===id);if(!c)return;
const has=S.ledger.some(x=>x.cid===id);
if(!has){if(!cf('ئەرێ '+c.name+' ژێببەم؟',arguments.callee,arguments))return;S.customers=S.customers.filter(x=>x.id!==id);logA('ژێبرنا کڕیاری: '+c.name);save();cdet=null;return render()}
if(!c.archived&&custBal(id)>0.5&&!cf('ئەڤ کڕیارە قەرز هەیە. ب ڕاگرتنێ ژ لیستا هەلبژارتنێ دچیت. بەردەوام؟',arguments.callee,arguments))return;
c.archived=!c.archived;logA((c.archived?'ڕاگرتنا کڕیاری: ':'ڤەگەڕاندنا کڕیاری: ')+c.name);save();render()}
function adjDone(id){if(!isOwner())return deny();const a=parseFloat($('aj_a').value),n=$('aj_n').value.trim();
if(isNaN(a)||a===0)return alert('چەندێ دروست بنڤیسە');if(!n)return alert('هۆکارێ بنڤیسە');
if(!cf('ڕاستکرنا قەرزی ب '+(a>0?'+':'')+m(a)+'؟',arguments.callee,arguments))return;
ledAdd({cid:id,type:'adj',amt:Math.round(a),note:n});logA('ڕاستکرنا قەرزی: '+custName(id)+' '+(a>0?'+':'')+a+' ('+n+')');save();render()}
function dpCalc(c){const b=custBal(c.id),r=rateOf(cpay.cur),rv=cpay.recv===''?0:cpay.recv,base=Math.round(rv*r),applied=Math.min(Math.max(b,0),base),ch=base-applied;return {b,r,rv,base,applied,ch}}
function dpCard(c){const cur=cpay.cur;
return '<div class="card"><h2>💵 وەرگرتنا پارەیێ قەرزی</h2><div class="chips">'+CUR.map(x=>'<button aria-pressed="'+(cur===x[0])+'" onclick="cpay.cur=\''+x[0]+'\';cpay.recv=\'\';cpay.gave=false;render()">'+x[1]+' '+x[2]+'</button>').join('')+'</div>'+
(cur!=='IQD'?'<div class="row" style="align-items:center"><span>١'+sym(cur)+' =</span><input type="number" min="0" step="any" value="'+(S.rates[cur]||'')+'" placeholder="نرخ" oninput="dpRate(this.value)" style="max-width:140px"'+(can('rates')?'':' readonly')+'><span>د.ع</span></div>':'')+
'<input type="number" min="0" step="any" placeholder="پارەیێ وەرگرتی" value="'+(cpay.recv===''?'':cpay.recv)+'" oninput="cpay.recv=this.value===\'\'?\'\':(parseFloat(this.value)||0);cpay.gave=false;dpUpd(\''+c.id+'\')" style="margin:8px 0" aria-label="پارەیێ وەرگرتی"><div id="dpp">'+dpText(c)+'</div></div>'}
function dpRate(v){if(!can('rates'))return;S.rates[cpay.cur]=parseFloat(v)||0;cpay.gave=false;save();const c=S.customers.find(x=>x.id===cdet);if(c)dpUpd(c.id)}
function dpUpd(id){const c=S.customers.find(x=>x.id===id),e=$('dpp');if(c&&e)e.innerHTML=dpText(c)}
function dpText(c){const d=dpCalc(c);if(!d.r)return '<div class="low">نرخێ گۆڕینێ دیار بکە'+(can('rates')?'':' (ب خودان دوکانێ بێژە)')+'</div>';
const ok=d.applied>0&&(d.ch<0.5||cpay.gave);
return '<div class="mu">قەرزێ نوکە: '+m(d.b)+'</div>'+(d.rv>0?'<div>دکەڤیتە حسابی: <b>'+m(d.applied)+'</b>'+(cpay.cur!=='IQD'?' <span class="mu">('+fc(d.rv,cpay.cur)+')</span>':'')+'</div><div class="mu">قەرز پشتی وێ: '+m(d.b-d.applied)+'</div>':'')+
(d.ch>=0.5?'<div class="ok" style="font-size:20px;font-weight:800">باقی بدە ب دینار: '+m(d.ch)+'</div><label class="pl"><input type="checkbox" '+(cpay.gave?'checked':'')+' onchange="cpay.gave=this.checked;dpUpd(\''+c.id+'\')" style="width:auto"> باقی دام</label>':'')+
'<div class="row" style="margin-top:8px"><button class="btn" '+(ok?'':'disabled')+' onclick="dpDone(\''+c.id+'\')">وەرگرتن</button></div>'}
function dpDone(id){if(!can('debtPay'))return deny();const c=S.customers.find(x=>x.id===id);if(!c||!cpay)return;const d=dpCalc(c);
if(!d.r)return alert('نرخێ گۆڕینێ دیار بکە');if(d.applied<=0)return alert('چەندێ دروست بنڤیسە');if(d.ch>=0.5&&!cpay.gave)return alert('باقی بدە و تیکا «باقی دام» بکە');
ledAdd({cid:id,type:'pay',amt:-d.applied,cur:cpay.cur,rate:d.r,recv:d.rv});
cashAdd('debt',cpay.cur,d.rv,id,c.name);if(d.ch>=0.5)cashAdd('change','IQD',-d.ch,id,c.name);
logA('وەرگرتنا قەرزی: '+c.name+' '+m(d.applied)+(cpay.cur!=='IQD'?' ('+fc(d.rv,cpay.cur)+')':''));
const rem=custBal(id);cpay={cur:'IQD',recv:'',gave:false};save();render();alert('هاتە تۆمارکرن ✓'+(d.ch>=0.5?'\nباقی بدە: '+m(d.ch):'')+'\nقەرز ماوە: '+m(Math.max(0,rem)))}

function modeTog(){if(!can('credit'))return '';const cr=pst&&pst.mode==='credit';return '<div class="chips"><button aria-pressed="'+!cr+'" onclick="setMode(\'cash\')">💵 پارە</button><button aria-pressed="'+cr+'" onclick="setMode(\'credit\')">📒 قەرز</button></div>'}
function setMode(v){if(v==='credit'&&!can('credit'))return deny();pst.mode=v;pst.cur='IQD';pst.recv='';pst.gave=false;if(v==='credit'&&!pst.cr)pst.cr={cid:null,down:'',q:''};cartUI()}
function cpTot(){const t=cart.reduce((a,x)=>a+x.price*x.qty,0);return Math.round((t-dcalc(t))*100)/100}
function cpErr(){const c=pst.cr,tot=cpTot(),down=c.down===''?0:c.down,debt=Math.round((tot-down)*100)/100,cu=c.cid?S.customers.find(x=>x.id===c.cid):null;
if(!cu)return {err:'کڕیارەکێ هەلبژێرە',cu,tot,down,debt};
if(down<0)return {err:'پێشدان دروست نینە',cu,tot,down,debt};
if(down>=tot-0.5)return {err:'پێشدان دڤێت کێمتر ژ کۆمێ فاتورێ بیت. بۆ پارەدانا تەمام «پارە» هەلبژێرە.',cu,tot,down,debt};
if(cu.limit>0&&custBal(cu.id)+debt>cu.limit+0.5){if(isOwner())return {warn:'قەرز ژ سنوورێ کڕیاری ('+m(cu.limit)+') زێدەتر دبیت.',cu,tot,down,debt};return {err:'قەرز ژ سنوورێ کڕیاری ('+m(cu.limit)+') زێدەتر دبیت. ب خودان دوکانێ بێژە.',cu,tot,down,debt}}
return {cu,tot,down,debt}}
function cpListHTML(){const c=pst.cr,cu=c.cid?S.customers.find(x=>x.id===c.cid):null;
if(cu){const b=custBal(cu.id);return '<div class="mu">👤 <b>'+esc(cu.name)+'</b> '+esc(cu.phone||'')+' · قەرزێ نوکە: <span class="'+(b>0.5?'low':'')+'">'+m(b)+'</span>'+(cu.limit>0?' · سنوور: '+m(cu.limit)+' · ماوە: '+m(Math.max(0,cu.limit-Math.max(b,0))):'')+' <button class="btn r" onclick="cPick(null)">گۆڕین</button></div>'}
const q=nd(c.q).trim().toLowerCase(),a=S.customers.filter(x=>!x.archived&&(!q||x.name.toLowerCase().indexOf(q)>=0||nd(x.phone).indexOf(q)>=0)).slice(0,6);
return a.map(x=>'<button class="btn g" style="margin:2px" onclick="cPick(\''+x.id+'\')">'+esc(x.name)+(custBal(x.id)>0.5?' · '+m(custBal(x.id)):'')+'</button>').join('')+' <button class="btn r" onclick="cnOpen()">＋ نوی</button>'}
function cpSumHTML(){const e=cpErr();
return '<div style="margin:8px 0"><div>کۆمێ فاتورێ: <b>'+m(e.tot)+'</b></div><div>پێشدان: <b>'+m(e.down)+'</b></div><div class="warn" style="font-size:18px;font-weight:800">دکەڤیتە قەرزی: '+m(Math.max(0,e.debt))+'</div>'+(e.cu&&!e.err?'<div class="mu">قەرزێ کڕیاری پشتی ڤێ: '+m(custBal(e.cu.id)+e.debt)+'</div>':'')+(e.warn?'<div class="warn">⚠ '+e.warn+'</div>':'')+(e.err?'<div class="low">'+e.err+'</div>':'')+'</div><div class="row"><button class="btn" '+(e.err?'disabled':'')+' onclick="pay()">تەمامکرن</button><button class="btn g" onclick="pst=null;dsc=null;cartUI()">ڕاکرن</button></div>'}

function c128(str){str=String(str==null?'':str);if(!str.length)return null;const v=[];

let sum=v[0];for(let i=1;i<v.length;i++)sum+=v[i]*i;v.push(sum%103);v.push(106);return v.map(x=>C128[x]).join('')}

function archAsk(n){if(!isOwner())return deny();if(!cf('فرۆتنێن کۆنتر ژ '+n+' هەیڤان دێ بچنە ئارشیڤێ (ل ناڤ ئامیری، و د Backup دا دهێن). ئەو ژ ڕاپۆرتێن ڕۆژانە دچن، بەلێ ژمارێن وان ل خوارێ دمینن. بەردەوام؟',arguments.callee,arguments))return;archDo(n)}
async function archDo(keep){if(!isOwner())return deny();if(!IDB)return alert('ئارشیڤ پێدڤی ب IndexedDB یە، ڤێ وێبگەڕێ پشتگیری ناکەت');
const now=new Date(),cutoff=new Date(now.getFullYear(),now.getMonth()-keep,1).getTime(),lc=lastClose();
const oldS=S.sales.filter(function(x){return x.t<cutoff}),oldC=lc?S.cash.filter(function(x){return x.t<cutoff&&x.t<=lc.t}):[];
if(!oldS.length&&!oldC.length)return alert('هیچ داتایەکا کۆنتر ژ '+keep+' هەیڤان نینە');
const by={};oldS.forEach(function(x){const k=mk(x.t);(by[k]=by[k]||{s:[],c:[]}).s.push(x)});oldC.forEach(function(x){const k=mk(x.t);(by[k]=by[k]||{s:[],c:[]}).c.push(x)});
const idx={};
for(const k of Object.keys(by)){const rec=(await idbGet('arch:'+k))||{sales:[],cash:[]},sid={},cid={};rec.sales.forEach(function(x){sid[x.id]=1});rec.cash.forEach(function(x){cid[x.id]=1});
 by[k].s.forEach(function(x){if(!sid[x.id])rec.sales.push(x)});by[k].c.forEach(function(x){if(!cid[x.id])rec.cash.push(x)});
 if(!(await idbPut('arch:'+k,rec))){return alert('نەشیا ئارشیڤ بپارێزیت. هیچ تشتەک نەهاتە ژێبرن.')}
 const chk=await idbGet('arch:'+k);if(!chk||chk.sales.length!==rec.sales.length||chk.cash.length!==rec.cash.length)return alert('پشکنینا ئارشیڤێ سەرنەکەفت. هیچ تشتەک نەهاتە ژێبرن.');
 idx[k]={n:rec.sales.length,sum:Math.round(rec.sales.reduce(function(a,x){return a+x.total},0)),gp:Math.round(rec.sales.reduce(function(a,x){return a+saleGP(x)},0)),cn:rec.cash.length}}
S.sales=S.sales.filter(function(x){return x.t>=cutoff});const dc={};oldC.forEach(function(x){dc[x.id]=1});S.cash=S.cash.filter(function(x){return !dc[x.id]});
Object.keys(idx).forEach(function(k){S.arch.months[k]=idx[k]});logA('ئارشیڤکرن: '+oldS.length+' فرۆتن · '+oldC.length+' جووڵەیێن سندوقێ');save();render();toast('✓ ئارشیڤ هات: '+oldS.length+' فرۆتن')}
async function archBack(k){if(!isOwner())return deny();const rec=await idbGet('arch:'+k);if(!rec)return alert('داتایا ڤی هەیڤی ل ڤی ئامیری نینە (دشێت ل ئامیرەکێ دی یان ل Backup بیت).');
const sid={},cid={};S.sales.forEach(function(x){sid[x.id]=1});S.cash.forEach(function(x){cid[x.id]=1});
rec.sales.forEach(function(x){if(!sid[x.id])S.sales.push(x)});rec.cash.forEach(function(x){if(!cid[x.id])S.cash.push(x)});S.sales.sort(function(a,b){return a.t-b.t});S.cash.sort(function(a,b){return a.t-b.t});
delete S.arch.months[k];await idbDel('arch:'+k);logA('ڤەگەڕاندنا ئارشیڤا '+k);save();render()}
async function bkFull(){const o=bkObj();if(IDB&&S.arch&&Object.keys(S.arch.months).length){o.arch={};for(const k of Object.keys(S.arch.months)){const r=await idbGet('arch:'+k);if(r)o.arch[k]=r}}return o}
function archNote(f){const ks=Object.keys((S.arch&&S.arch.months)||{}).filter(function(k){return monthEnd(k)>f});if(!ks.length)return '';const n=ks.reduce(function(a,k){return a+S.arch.months[k].n},0);
return '<div class="card"><p class="warn" style="margin:0">📦 '+ks.length+' هەیڤ ('+n+' فرۆتن) ل ئارشیڤێ نە و د ڤێ ڕاپۆرتێ دا نینن. بۆ دیتنا ژمارێن وان: تابا «داتا» ← 📦 ئارشیڤ.</p></div>'}
function archCard(){if(!isOwner())return '';const ks=Object.keys(S.arch.months).sort().reverse(),kb=Math.round(JSON.stringify(S).length/1024),old=S.sales.length?mk(S.sales.reduce(function(a,x){return Math.min(a,x.t)},Infinity)):'—';
return '<div class="act"><div class="ai">📦</div><div style="flex:1"><h3>ئارشیڤ</h3><p>فرۆتنێن کۆن ژ سیستەمی دچنە ئارشیڤێ دا سیستەم خێرا بمینیت. داتا نابیتە ژ دەست: ل ناڤ ئامیری یە و د Backup دا دهێت.</p><div class="mu">داتایا نوکە: '+kb+' KB · '+S.sales.length+' فرۆتن · کۆنترین: '+old+' · '+(IDB?'IndexedDB ✓':'IndexedDB نینە')+'</div><div class="row" style="flex-wrap:wrap;margin-top:8px"><button class="btn g" onclick="archAsk(3)">ژ ٣ هەیڤان کۆنتر</button><button class="btn g" onclick="archAsk(6)">ژ ٦ هەیڤان کۆنتر</button><button class="btn g" onclick="archAsk(12)">ژ ١٢ هەیڤان کۆنتر</button></div>'+
(ks.length?'<div class="wrap" style="margin-top:8px"><table><thead><tr><th>هەیڤ</th><th>فرۆتن</th><th>کۆم</th>'+(can('cost')?'<th>قازانج</th>':'')+'<th></th></tr></thead><tbody>'+ks.map(function(k){const a=S.arch.months[k];return '<tr><td>'+k+'</td><td>'+a.n+'</td><td>'+m(a.sum)+'</td>'+(can('cost')?'<td>'+m(a.gp)+'</td>':'')+'<td><button class="btn g" onclick="archBack(\''+k+'\')">↩ ڤەگەڕاندن</button></td></tr>'}).join('')+'</tbody></table></div>':'<p class="mu">هێشتا ئارشیڤ نینە.</p>')+'</div></div>'}
function rsUndo(){if(!can('restore'))return deny();let x=null;try{x=localStorage.getItem('shop_prev')}catch(e){}
if(!x&&IDB){idbGet('prev').then(function(r){if(r&&r.json)rsUndo2(r.json);else alert('کۆپییەکا بەری نینە')});return}
if(!x)return alert('کۆپییەکا بەری نینە');rsUndo2(x)}
function rsUndo2(x){if(!cf('داتایا بەری ڤەگەڕاندنا دوماهیێ بزڤڕینم؟',rsUndo2,[x]))return;
const o=JSON.parse(x);if(!isOwner()){o.users=S.users;o.rec=S.rec}S=o;normS();try{localStorage.removeItem('shop_prev')}catch(e){}prevFlag=false;if(IDB)idbDel('prev');save(true);cart=[];last=null;rs=null;curU=S.users.find(function(u){return curU&&u.id===curU.id&&u.active!==false})||null;if(!curU)return logout();render()}

storeReady.then(function(){boot()});
</script>
