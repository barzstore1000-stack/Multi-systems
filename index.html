<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سیستەمێ دوکانێ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6feb">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دوکان">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--sf:#fff;--ink:#14202e;--mu:#5d6b7a;--ln:#d6dde5;--ac:#1f6feb;--soft:#e3edff;--bad:#c92a2a;--ok:#2b8a3e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--sf:#18222e;--ink:#eaf0f6;--mu:#9aa8b6;--ln:#2b3846;--soft:#1b2a40;--bad:#ff6b6b;--ok:#51cf66}}
:root[data-theme="dark"]{--bg:#0f1720;--sf:#18222e;--ink:#eaf0f6;--mu:#9aa8b6;--ln:#2b3846;--soft:#1b2a40;--bad:#ff6b6b;--ok:#51cf66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Kufi Arabic",Tahoma,sans-serif;line-height:1.7}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
nav button{flex:1 0 auto;font:inherit;padding:10px 14px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chips button{font:inherit;padding:6px 14px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;cursor:pointer}.chips button[aria-pressed="true"]{background:var(--ac);color:#fff;border-color:var(--ac)}.bar{height:8px;background:var(--ac);border-radius:4px;min-width:2px}.hero{display:flex;gap:14px;align-items:center;border-radius:18px;padding:18px;color:#fff;margin-bottom:14px;background:linear-gradient(135deg,var(--h1),var(--h2))}
.hero .hi{font-size:38px;line-height:1;background:rgba(255,255,255,.2);border-radius:16px;padding:10px}
.hero b{font-size:18px;display:block}.hero span{opacity:.93;font-size:14px}
.st-ok{--h1:#2b8a3e;--h2:#1c6b5a}.st-warn{--h1:#e8590c;--h2:#c2410c}.st-bad{--h1:#c92a2a;--h2:#8f1d1d}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;text-align:center}
.tile strong{display:block;font-size:22px;color:var(--ac)}.tile small{color:var(--mu)}
.act{display:flex;gap:14px;align-items:flex-start;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
.act .ai{font-size:26px;width:52px;height:52px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.act h3{margin:0 0 4px;font-size:16px}.act p{margin:0 0 10px;color:var(--mu);font-size:13px}
.bnr{display:flex;gap:10px;align-items:center;justify-content:space-between;background:color-mix(in srgb,#e8590c 14%,var(--sf));color:var(--ink);border:1px solid #e8590c;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.lockw{max-width:440px;margin:7vh auto;padding:16px}.pl{display:block;padding:5px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
h2{font-size:16px;margin:0 0 10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}
.row{display:flex;gap:8px;margin-bottom:8px}
.btn{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.g{background:var(--soft);color:var(--ac)}
.btn.r{background:transparent;color:var(--bad);padding:4px 8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--ln)}
th{color:var(--mu);font-size:12px;font-weight:600}
.low{color:var(--bad);font-weight:600}.ok{color:var(--ok);font-weight:600}.warn{color:#e67700;font-weight:600}.bt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px}
.stat small{color:var(--mu);display:block;font-size:12px}
.stat strong{font-size:20px;color:var(--ac)}
.mu{color:var(--mu);font-size:13px}
.inv{border:1px dashed var(--ln);border-radius:10px;padding:12px;margin-top:10px}
@media print{body *{visibility:hidden}.inv,.inv *{visibility:visible}.inv{position:absolute;inset:0;border:0}}
</style>
</head>
<body>
<main id="app" style="display:none">
<h1>🛒 سیستەمێ دوکانێ</h1>
<div id="ubar"></div>
<div id="bk"></div>
<nav id="nav"></nav>
<div id="v"></div>
</main>
<div id="lockscr" style="display:none"></div>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const LOW=5;
let saveErr=false;let S={products:[],sales:[]};
try{const x=localStorage.getItem('shop');if(x)S=JSON.parse(x)}catch(e){}
S.products.forEach(p=>{if(!p.batches)p.batches=p.stock>0?[{id:1,qty:p.stock,exp:''}]:[]});
if(!S.returns)S.returns=[];
function newCode(){const n=S.products.map(p=>/^P\d+$/.test(p.code||'')?parseInt(p.code.slice(1)):0);return 'P'+(Math.max(1000,...n)+1)}
S.products.forEach(p=>{if(!p.code)p.code=newCode()});
function sync(p){p.stock=p.batches.reduce((a,b)=>a+b.qty,0)}
function dl(e){return Math.round((new Date(e+'T00:00:00')-new Date(new Date().toDateString()))/864e5)}
function avail(p){return p.batches.reduce((a,b)=>a+((b.exp&&dl(b.exp)<0)?0:b.qty),0)}
function save(k){if(!k)S.dirty=(S.dirty||0)+1;try{localStorage.setItem('shop',JSON.stringify(S));saveErr=false}catch(e){saveErr=true;try{bannerUI()}catch(x){}}}
let tab='sell',cart=[],last=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>Math.round(n).toLocaleString('en')+' د.ع';
const tabs=[['sell','فرۆتن'],['prod','بەرهەم'],['stock','ستۆک'],['rep','ڕاپۆرت'],['data','داتا']];
function nav(){$('nav').innerHTML=tabsFor().map(t=>'<button aria-pressed="'+(tab===t[0])+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>').join('')}
function go(t){stopScan();editId=null;eb=null;ue=null;recShow=null;tab=t;render()}
function render(){if(!curU)return;const ts=tabsFor();if(!ts.some(t=>t[0]===tab))tab=ts.length?ts[0][0]:'none';nav();userBar();bannerUI();
if(tab==='none'){$('v').innerHTML='<div class="card"><p>هیچ ڕێپێدانەک بۆ تە نەهاتیە دانان. ب خودان دوکانێ بێژە.</p></div>';return}
({sell,prod,stock,rep,data:dataTab,usr:usersTab})[tab]()}

let editId=null;
function prod(){
const ed=editId?S.products.find(x=>x.id===editId):null;if(editId&&!ed)editId=null;
const form=ed?
'<div class="card"><h2>گۆڕینا بەرهەمی</h2><div class="row"><input id="b" value="'+esc(ed.code||'')+'" placeholder="بارکۆد / کۆد" onkeydown="kd(event)"><button class="btn g" onclick="scan()">📷 سکانکرن</button></div><div id="rd"></div><div class="row"><input id="n" value="'+esc(ed.name)+'" placeholder="ناڤێ بەرهەمی"><input id="p" type="number" min="0" step="any" value="'+ed.price+'" placeholder="بها"></div><p class="mu">چەندیا ستۆکێ و دەمێ بەسەرچوونێ ل بەشێ <b>ستۆک</b> دهێنە گۆڕین. فاتورێن کۆن ناهێنە گۆڕین.</p><button class="btn" onclick="saveP()">پاشەکەفتکرن</button> <button class="btn g" onclick="cancelP()">ڕاکرن</button></div>':
'<div class="card"><h2>بەرهەمەکێ نوی زێدە بکە</h2><div class="row"><input id="b" placeholder="بارکۆد / کۆد (ب دەست یان ب سکانکرنێ)" onkeydown="kd(event)"><button class="btn g" onclick="scan()">📷 سکانکرن</button></div><div id="rd"></div><div class="row"><input id="n" placeholder="ناڤێ بەرهەمی"><input id="p" type="number" min="0" step="any" placeholder="بها"><input id="q" type="number" min="0" placeholder="چەند"><input id="e" type="date" aria-label="دەمێ بەسەرچوونێ" title="دەمێ بەسەرچوونێ"></div><p class="mu">دەمێ بەسەرچوونێ (ئارەزوومەندانە): دەمێ باتچا یەکەمە</p><button class="btn" onclick="addP()">زێدەکرن</button></div>';
$('v').innerHTML=((ed&&!can('prodEdit'))||(!ed&&!can('prodAdd'))?'':form)+
'<div class="card"><h2>هەمی بەرهەم ('+S.products.length+')</h2>'+(S.products.length?'<div class="wrap"><table><thead><tr><th>کۆد</th><th>بەرهەم</th><th>بها</th><th>ماین</th><th></th></tr></thead><tbody>'+
S.products.map(p=>'<tr'+(p.id===editId?' style="background:var(--soft)"':'')+'><td class="mu">'+(p.code?esc(p.code):'—')+'</td><td>'+esc(p.name)+'</td><td>'+m(p.price)+'</td><td>'+p.stock+'</td><td>'+(can('prodEdit')?'<button class="btn g" onclick="editP('+p.id+')">گۆڕین</button> ':'')+(can('prodDel')?'<button class="btn r" onclick="delP('+p.id+')">ژێبرن</button>':'')+'</td></tr>').join('')+
'</tbody></table></div>':'<p class="mu">هێشتا بەرهەم نینن. یەکەم بەرهەم زێدە بکە.</p>')+'</div>'}
function editP(id){if(!can('prodEdit'))return deny();stopScan();editId=id;prod();window.scrollTo({top:0,behavior:'smooth'})}
function cancelP(){stopScan();editId=null;prod()}
function saveP(){if(!can('prodEdit'))return deny();const p=S.products.find(x=>x.id===editId);if(!p)return;
const code=$('b').value.trim()||p.code,name=$('n').value.trim(),price=parseFloat($('p').value);
if(!name||isNaN(price)||price<0)return alert('ناڤ و بها پڕ بکە');
if(S.products.some(x=>x.id!==p.id&&x.code===code))return alert('ئەڤ کۆدە بەری نوکە بۆ بەرهەمەکێ دی هاتیە تۆمارکرن');
stopScan();if(p.price!==price)logA('گۆڕینا بهایی: '+p.name+' '+p.price+' → '+price);if(p.name!==name)logA('گۆڕینا ناڤی: '+p.name+' → '+name);p.code=code;p.name=name;p.price=price;
cart.forEach(c=>{if(c.id===p.id){c.name=name;c.price=price}});
editId=null;save();prod()}
function stock(){
const opts=S.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+(p.code?' ('+esc(p.code)+')':'')+'</option>').join('');
$('v').innerHTML=(!can('stockAdj')?'':'<div class="card"><h2>باتچەکێ نوی (کالایێ هاتی)</h2>'+(S.products.length?'<div class="row"><input id="rc" placeholder="کۆد / سکان + Enter" onkeydown="kdR(event)"><select id="rp">'+opts+'</select></div><div class="row"><input id="rq" type="number" min="1" placeholder="چەند"><input id="re" type="date" aria-label="دەمێ بەسەرچوونێ" title="دەمێ بەسەرچوونێ"></div><p class="mu">دەمێ بەسەرچوونێ ئارەزوومەندانەیە</p><button class="btn" onclick="recv()">زێدەکرن</button>':'<p class="mu">ل بەشێ بەرهەمان بەرهەمەکێ زێدە بکە.</p>')+'</div>')+
'<div class="card"><h2>ستۆک و باتچ</h2>'+(S.products.length?'<div class="wrap"><table><thead><tr><th>کالا</th><th>ماین</th><th>باتچ</th></tr></thead><tbody>'+
S.products.map(p=>'<tr><td>'+esc(p.name)+'</td><td class="'+(p.stock<=LOW?'low':'')+'">'+p.stock+(p.stock<=LOW?' ⚠':'')+'</td><td>'+(p.batches.length?[...p.batches].sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999')).map(b=>{const d=b.exp?dl(b.exp):null;const c=d!==null&&d<0?'low':(d!==null&&d<=30?'warn':'');if(eb&&eb.p===p.id&&eb.b===b.id)return bEdit(b);return '<div class="bt"><span>'+b.qty+' ×</span><span class="'+c+'">'+(b.exp?(d<0?'بەسەرچوو ('+b.exp+')':b.exp+(d<=30?' · ماوە '+d+' ڕۆژ':'')):'بێ دەم')+'</span>'+(can('stockAdj')?'<button class="btn g" onclick="bStart('+p.id+','+b.id+')">گۆڕین</button><button class="btn r" onclick="delB('+p.id+','+b.id+')">ژێبرن</button>':'')+'</div>'}).join(''):'<span class="mu">—</span>')+'</td></tr>').join('')+
'</tbody></table></div>':'<p class="mu">هێشتا بەرهەم نینن.</p>')+'</div>'}
function addP(){if(!can('prodAdd'))return deny();let code=$('b').value.trim(),name=$('n').value.trim(),price=parseFloat($('p').value),q=parseInt($('q').value);
if(!name||isNaN(price)||isNaN(q))return alert('ناڤ، بها و چەند پڕ بکە');
if(!code)code=newCode();if(code&&S.products.some(p=>p.code===code))return alert('ئەڤ کۆدە بەری نوکە بۆ بەرهەمەکێ دی هاتیە تۆمارکرن');stopScan();const exp=$('e').value;S.products.push({id:Date.now(),code,name,price,stock:q,batches:q>0?[{id:1,qty:q,exp}]:[]});logA('بەرهەمەکێ نوی: '+name);save();prod()}
let sc=null;
function kd(e){if(e.key==='Enter'){e.preventDefault();$('n').focus()}}
async function scan(){
if(sc){stopScan();return}
if(!window.Html5Qrcode)return alert('سکانەر نەهاتە بارکرن. ئینتەرنێتێ پشکنە یان کۆدی ب دەست بنڤیسە');
$('rd').innerHTML='<div id="cam" style="max-width:320px;margin:0 auto 10px"></div>';
sc=new Html5Qrcode('cam');
try{await sc.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:120}},t=>{$('b').value=t;stopScan();$('n').focus()})}
catch(e){stopScan();alert('کامێرا نەهاتە ڤەکرن. ڕێپێدانێ بدە یان کۆدی ب دەست بنڤیسە')}}
async function stopScan(){const s=sc;sc=null;try{if(s){await s.stop();s.clear()}}catch(e){}const r=$('rd');if(r)r.innerHTML='';const r2=$('rd2');if(r2)r2.innerHTML=''}
let eb=null;
function bEdit(b){return '<div class="bt"><input id="eq" type="number" min="0" value="'+b.qty+'" style="width:80px" aria-label="چەند"><input id="ee" type="date" value="'+(b.exp||'')+'" style="width:150px" aria-label="دەمێ بەسەرچوونێ"><button class="btn" onclick="bSave()">پاشەکەفتکرن</button><button class="btn g" onclick="eb=null;stock()">ڕاکرن</button></div>'}
function bStart(pid,bid){if(!can('stockAdj'))return deny();eb={p:pid,b:bid};stock()}
function bSave(){if(!can('stockAdj'))return deny();const p=S.products.find(x=>x.id===eb.p),b=p&&p.batches.find(x=>x.id===eb.b);if(!b){eb=null;return stock()}
const q=parseInt($('eq').value);if(isNaN(q)||q<0)return alert('چەندێ دروست بنڤیسە');
b.qty=q;b.exp=$('ee').value;p.batches=p.batches.filter(x=>x.qty>0);sync(p);logA('گۆڕینا باتچ: '+p.name+' → '+q);save();eb=null;stock()}
function kdR(e){if(e.key==='Enter'){e.preventDefault();const c=e.target.value.trim();if(!c)return;const p=S.products.find(x=>x.code===c);if(!p)return alert('ئەڤ کۆدە نینە');$('rp').value=p.id;e.target.value='';$('rq').focus()}}
function recv(){if(!can('stockAdj'))return deny();const p=S.products.find(x=>x.id===+$('rp').value),q=parseInt($('rq').value);if(!p||!(q>0))return alert('بەرهەم و چەند دیار بکە');
p.batches.push({id:Date.now(),qty:q,exp:$('re').value});sync(p);logA('باتچی نوی: '+p.name+' × '+q);save();stock()}
function delB(pid,bid){if(!can('stockAdj'))return deny();if(!confirm('ئەرێ ئەڤ باتچە ژێببەم؟'))return;const p=S.products.find(x=>x.id===pid);p.batches=p.batches.filter(b=>b.id!==bid);sync(p);logA('ژێبرنا باتچ: '+p.name);save();stock()}
function delP(id){if(!can('prodDel'))return deny();if(confirm('ئەرێ ژێببەم؟')){logA('ژێبرنا بەرهەمی: '+((S.products.find(p=>p.id===id)||{}).name));S.products=S.products.filter(p=>p.id!==id);cart=cart.filter(c=>c.id!==id);save();prod()}}

let rmode=false;
function note(t,bad){const e=$('sm');if(!e)return alert(t);e.textContent=t;e.className=bad?'low':'ok'}
function scanCard(t){return '<div class="card"><h2>'+t+'</h2><div class="row"><input id="sc" placeholder="بارکۆدی سکان بکە (یان کۆدی بنڤیسە + Enter)" onkeydown="kdS(event)" autocomplete="off"><button class="btn g" onclick="scanSell()">📷 سکانکرن</button></div><div id="sm" aria-live="polite" style="min-height:26px"></div><div id="rd"></div><div id="ct"></div></div>'}
function sell(){stopScan();
if(rmode&&!can('returns'))rmode=false;if(!rmode&&!can('sell')&&can('returns'))rmode=true;
$('v').innerHTML=chipsHTML()+
(rmode?'<div class="card"><h2>بەرهەمێ زڤڕای: بارکۆدی سکان بکە</h2><div id="rp"></div></div>'+scanCard('بەدەل ب بەرهەمێ دی (ئارەزوومەندانە)')+'<div id="rf"></div>':scanCard('فرۆتن'))+'<div id="iv"></div>';
cartUI();if(rmode)rPanel();else invUI();
if(!matchMedia('(pointer:coarse)').matches){const i=$(rmode?'rsq':'sc');if(i)i.focus()}}
function setR(v){if(v&&!can('returns'))return deny();if(!v&&!can('sell'))return deny();rmode=v;rs=null;rqry='';cart=[];sell()}
function byCode(code){code=code.trim();if(!code)return;if(rmode?!can('returns'):!can('sell'))return deny();const p=S.products.find(x=>String(x.code)===code);if(!p)return note('✗ ئەڤ کۆدە نینە: '+code,1);if(add(p.id)!==false)note('✓ '+p.name+' هاتە زێدەکرن')}
function kdS(e){if(e.key==='Enter'){e.preventDefault();const i=$('sc');byCode(i.value);i.value='';i.focus()}}
let lc='',lt=0;
async function scanSell(){
if(sc){stopScan();return}
if(!window.Html5Qrcode)return alert('سکانەر نەهاتە بارکرن. ئینتەرنێتێ پشکنە یان کۆدی ب دەست بنڤیسە');
$('rd').innerHTML='<div id="cam" style="max-width:320px;margin:0 auto 10px"></div>';
sc=new Html5Qrcode('cam');
try{await sc.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:120}},t=>{const n=Date.now();if(t===lc&&n-lt<2000)return;lc=t;lt=n;byCode(t)})}
catch(e){stopScan();alert('کامێرا نەهاتە ڤەکرن. ڕێپێدانێ بدە یان کۆدی ب دەست بنڤیسە')}}
function add(id){const p=S.products.find(x=>x.id===id);const c=cart.find(x=>x.id===id);
if((c?c.qty:0)+1>avail(p)){note('✗ ستۆک نەماوە: '+p.name,1);return false}
c?c.qty++:cart.push({id,name:p.name,price:p.price,qty:1});cartUI()}

function can(p){return !!curU&&(curU.role==='owner'||!!(curU.perms&&curU.perms[p]))}
function deny(){alert('ڕێپێدان بۆ ڤی کاری نینە. ب خودان دوکانێ بێژە.')}
function logA(a){S.log=S.log||[];S.log.push({t:Date.now(),u:curU?curU.name:'—',a});if(S.log.length>300)S.log=S.log.slice(-300)}
function rndHex(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function hp(pin,salt){const enc=new TextEncoder();
try{const k=await crypto.subtle.importKey('raw',enc.encode(String(pin)),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
catch(e){let h=5381;const t=salt+':'+pin;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return 'w'+(h>>>0).toString(16)}}
function newRecCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint8Array(10);crypto.getRandomValues(a);const c=[...a].map(x=>A[x%A.length]).join('');return c.slice(0,5)+'-'+c.slice(5)}
function normRec(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function bkObj(){return {app:'shop',ver:2,t:Date.now(),data:isOwner()?S:Object.assign({},S,{users:[],rec:null})}}
function tabsFor(){const a=[];
if(can('sell')||can('returns'))a.push(['sell','فرۆتن']);
if(can('prodView')||can('prodAdd')||can('prodEdit')||can('prodDel'))a.push(['prod','بەرهەم']);
if(can('stockView')||can('stockAdj'))a.push(['stock','ستۆک']);
if(can('reports'))a.push(['rep','ڕاپۆرت']);
if(can('backup')||can('restore'))a.push(['data','داتا']);
if(isOwner())a.push(['usr','ئەندام']);
return a}
function chipsHTML(){if(!(can('sell')&&can('returns')))return '';return '<div class="chips"><button aria-pressed="'+!rmode+'" onclick="setR(false)">🛒 فرۆتنا نوی</button><button aria-pressed="'+rmode+'" onclick="setR(true)">↩ زڤڕاندن / بەدەلکرن</button></div>'}
function startPay(){if(!can('sell'))return deny();if(can('discount')){dsc={step:'ask'};cartUI()}else toPay()}
function setRate(v){if(!can('rates'))return;S.rates[pst.cur]=parseFloat(v)||0;pst.gave=false;save();pUpd()}
function logRate(){if(!can('rates'))return;logA('نرخ: ١'+sym(pst.cur)+' = '+S.rates[pst.cur]+' د.ع');save(true)}
function byLine(x){return x.by?'<div class="mu">کاشێر: '+esc(x.by.n)+'</div>':''}
function cashCard(ss){const g={};ss.forEach(x=>{const k=x.by?x.by.n:'—';g[k]=g[k]||{n:0,t:0};g[k].n++;g[k].t+=x.total});const ks=Object.keys(g);
return '<div class="card"><h2>فرۆتن ب کاشێر</h2>'+(ks.length?'<div class="wrap"><table><thead><tr><th>کاشێر</th><th>فاتورە</th><th>کۆم</th></tr></thead><tbody>'+ks.map(k=>'<tr><td>'+esc(k)+'</td><td>'+g[k].n+'</td><td>'+m(g[k].t)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="mu">د ڤی دەمی دا فرۆتن نەبووە.</p>')+'</div>'}
function userBar(){const e=$('ubar');if(!e)return;e.innerHTML=curU?'<div class="mu" style="display:flex;justify-content:space-between;align-items:center;margin:-4px 0 10px"><span>👤 '+esc(curU.name)+' · '+(curU.role==='owner'?'خودان':'کاشێر')+'</span><button class="btn g" onclick="logout()">🔒 قفل</button></div>':''}

function lockUI(h){$('app').style.display='none';const L=$('lockscr');L.style.display='';L.innerHTML='<div class="lockw">'+h+'</div>'}
function enter(u){curU=u;selU=null;try{sessionStorage.setItem('shop_uid',u.id)}catch(e){}
if(lastU&&lastU!==u.id){cart=[];rs=null;last=null;dsc=null;pst=null;rmode=false}
lastU=u.id;lastAct=Date.now();const L=$('lockscr');L.style.display='none';L.innerHTML='';$('app').style.display='';render()}
function logout(){stopScan();curU=null;try{sessionStorage.removeItem('shop_uid')}catch(e){}showLogin()}
function boot(){
if(!S.users||!S.users.length){showSetup();return}
let u=null;try{const id=sessionStorage.getItem('shop_uid');if(id)u=S.users.find(x=>x.id===id&&x.active!==false)}catch(e){}
if(!u){showLogin();return}
enter(u)}
function showSetup(){lockUI('<div class="card"><h2>🔐 دەستپێک: خودان دوکانێ چێبکە</h2><p class="mu">ئەڤ هەژمارە هەمی ڕێپێدانان هەیە. PINێ ب بیر بینە. داتایێن تە یێن بەری نوکە ناهێنە گۆڕین.</p><input id="su_n" placeholder="ناڤ" autocomplete="off" style="margin-bottom:8px"><input id="su_p" type="password" inputmode="numeric" placeholder="PIN (٤ پیت/ژمارە و پتر)" autocomplete="new-password" style="margin-bottom:8px"><input id="su_p2" type="password" inputmode="numeric" placeholder="PIN دووبارە" autocomplete="new-password" onkeydown="if(event.key===\'Enter\')doSetup()" style="margin-bottom:8px"><div id="le" class="low" style="min-height:24px"></div><button class="btn" onclick="doSetup()">چێکرن</button></div>')}
async function doSetup(){const n=$('su_n').value.trim(),p=$('su_p').value,p2=$('su_p2').value,e=$('le');
if(!n)return e.textContent='ناڤ بنڤیسە';if(p.length<4)return e.textContent='PIN دڤێت ٤ پیت/ژمارە و پتر بیت';if(p!==p2)return e.textContent='دوو PIN وەک ئێک نینن';
const salt=rndHex(16),code=newRecCode(),rsalt=rndHex(16);
const u={id:'u'+Date.now(),name:n,role:'owner',perms:{},active:true,salt,hash:await hp(p,salt),created:Date.now()};
S.users=[u];S.rec={salt:rsalt,hash:await hp(normRec(code),rsalt)};S.lockMin=10;curU=u;logA('خودان دوکانێ هاتە چێکرن');curU=null;save();showRec(code,u.id)}
function showRec(code,uid){lockUI('<div class="card"><h2>🔑 کۆدا ڤەگەڕاندنا PIN</h2><p>ئەگەر PINێ ژبیر بکەی، ب ڤی کۆدی دشێی PINەکێ نوی دانی. ئەڤ کۆدە <b>جارەکێ تنێ</b> دیار دبیت. ل جهەکێ ئێمن بنڤیسە (نە ل ڤی ئامیری).</p><div style="font-size:28px;font-weight:800;letter-spacing:3px;direction:ltr;text-align:center;margin:14px 0">'+esc(code)+'</div><button class="btn" onclick="recDone(\''+uid+'\')">نڤیسیم، بەردەوام بە</button></div>')}
function recDone(id){const u=S.users.find(x=>x.id===id);if(u){logA2(u,'چوونەژوور');enter(u)}}
function logA2(u,a){const c=curU;curU=u;logA(a);curU=c;save(true)}
function showLogin(){const us=S.users.filter(u=>u.active!==false);if(!selU||!us.some(u=>u.id===selU))selU=us.length===1?us[0].id:null;
lockUI('<div class="card"><h2>🔐 چوونەژوور</h2><div class="chips">'+us.map(u=>'<button aria-pressed="'+(selU===u.id)+'" onclick="pickU(\''+u.id+'\')">👤 '+esc(u.name)+'</button>').join('')+'</div><input id="lp" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off" onkeydown="if(event.key===\'Enter\')doLogin()" style="margin-bottom:8px"><div id="le" class="low" style="min-height:24px"></div><button class="btn" onclick="doLogin()">چوونەژوور</button> <button class="btn r" onclick="showRecover()">PIN ژبیرکر؟</button></div>');
try{if(!matchMedia('(pointer:coarse)').matches){const i=$('lp');if(i)i.focus()}}catch(e){}}
function pickU(id){selU=id;showLogin()}
async function doLogin(){const e=$('le');
if(Date.now()<lockUntil)return e.textContent='گەلەک جاران PINا خەلەت. ڕاوەستە '+Math.ceil((lockUntil-Date.now())/1000)+' چرکەیان';
const u=S.users.find(x=>x.id===selU&&x.active!==false);if(!u)return e.textContent='ناڤەکێ هەلبژێرە';
const h=await hp($('lp').value,u.salt);
if(h===u.hash){fails=0;fl();logA2(u,'چوونەژوور');enter(u)}
else{fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}fl();logA2(u,'PINا خەلەت');e.textContent='PIN خەلەتە';$('lp').value=''}}
function showRecover(){const os=S.users.filter(u=>u.role==='owner'&&u.active!==false);
lockUI('<div class="card"><h2>PIN ژبیرکر؟</h2><p class="mu">کۆدا ڤەگەڕاندنێ بنڤیسە (ئەو کۆدا دەمێ دەستپێکێ هاتیە دان) و PINەکێ نوی دانە. ئەڤە تنێ بۆ خودانانە.</p><select id="rc_u" style="margin-bottom:8px">'+os.map(u=>'<option value="'+u.id+'">'+esc(u.name)+'</option>').join('')+'</select><input id="rc_c" placeholder="XXXXX-XXXXX" autocomplete="off" style="margin-bottom:8px"><input id="rc_p" type="password" inputmode="numeric" placeholder="PINی نوی (٤ پیت/ژمارە و پتر)" autocomplete="new-password" style="margin-bottom:8px"><div id="le" class="low" style="min-height:24px"></div><button class="btn" onclick="doRecover()">PIN بگۆڕە</button> <button class="btn g" onclick="showLogin()">ڤەگەڕە</button></div>')}
async function doRecover(){const e=$('le'),u=S.users.find(x=>x.id===$('rc_u').value),p=$('rc_p').value;
if(!S.rec)return e.textContent='کۆدا ڤەگەڕاندنێ نینە';
if(Date.now()<lockUntil)return e.textContent='ڕاوەستە '+Math.ceil((lockUntil-Date.now())/1000)+' چرکەیان';
if(p.length<4)return e.textContent='PIN دڤێت ٤ پیت/ژمارە و پتر بیت';
const h=await hp(normRec($('rc_c').value),S.rec.salt);
if(h!==S.rec.hash){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}fl();return e.textContent='کۆد خەلەتە'}
fails=0;fl();u.salt=rndHex(16);u.hash=await hp(p,u.salt);const code=newRecCode(),rsalt=rndHex(16);S.rec={salt:rsalt,hash:await hp(normRec(code),rsalt)};
logA2(u,'PIN هاتە گۆڕین ب کۆدا ڤەگەڕاندنێ');save(true);showRec(code,u.id)}

function usersTab(){if(!isOwner())return;
const rows=S.users.map(u=>'<tr><td>'+esc(u.name)+(u.id===curU.id?' <span class="mu">(تۆ)</span>':'')+'</td><td class="mu">'+(u.role==='owner'?'خودان':'کاشێر')+'</td><td>'+(u.active===false?'<span class="low">ڕاگرتی</span>':'<span class="ok">چالاک</span>')+'</td><td><button class="btn g" onclick="uEdit(\''+u.id+'\')">گۆڕین</button></td></tr>').join('');
const lk=S.lockMin==null?10:S.lockMin;
const lg=(S.log||[]).slice(-40).reverse().map(x=>'<tr><td class="mu">'+new Date(x.t).toLocaleString('en-GB')+'</td><td>'+esc(x.u)+'</td><td>'+esc(x.a)+'</td></tr>').join('');
$('v').innerHTML=(ue?uForm():'')+
'<div class="card"><h2>ئەندام ('+S.users.length+')</h2><div class="wrap"><table><thead><tr><th>ناڤ</th><th>ڕۆل</th><th>دۆخ</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div><button class="btn" style="margin-top:10px" onclick="uNew()">＋ ئەندامەکێ نوی</button></div>'+
'<div class="card"><h2>ئاسایش</h2><label class="pl">قفلکرنا ب خۆکار پشتی نەبکارئینانێ: <select onchange="setLock(this.value)" style="width:auto">'+[0,5,10,30].map(v=>'<option value="'+v+'"'+(lk===v?' selected':'')+'>'+(v?v+' خولەک':'نەچالاک')+'</option>').join('')+'</select></label><button class="btn g" style="margin-top:8px" onclick="newRec()">کۆدەکێ نوی بۆ ڤەگەڕاندنا PIN</button>'+
(recShow?'<div class="inv" style="margin-top:10px"><b>کۆدا نوی (جارەکێ دیار دبیت):</b><div style="font-size:24px;font-weight:800;letter-spacing:2px;direction:ltr;text-align:center;margin:8px 0">'+esc(recShow)+'</div><span class="mu">ل جهەکێ ئێمن بنڤیسە. کۆدا کۆن چوو.</span></div>':'')+'</div>'+
'<div class="card"><h2>تۆمارا کاران</h2>'+(lg?'<div class="wrap" style="max-height:320px;overflow-y:auto"><table><tbody>'+lg+'</tbody></table></div>':'<p class="mu">—</p>')+'</div>'}
function uNew(){ue='new';render()}
function uEdit(id){ue=id;render()}
function uCancel(){ue=null;render()}
function uRole(v){const b=$('pb');if(b)b.style.display=v==='owner'?'none':''}
function uPreset(k){PERMS.forEach(p=>{$('pm_'+p[0]).checked=PRESETS[k].p.includes(p[0])})}
function uForm(){
const nu=ue==='new',u=nu?{name:'',role:'staff',perms:{sell:true},active:true}:S.users.find(x=>x.id===ue);if(!u){ue=null;return ''}
const self=!nu&&u.id===curU.id;
return '<div class="card"><h2>'+(nu?'ئەندامەکێ نوی':'گۆڕینا ئەندامی')+'</h2>'+
'<input id="un" value="'+esc(u.name)+'" placeholder="ناڤ" autocomplete="off" style="margin-bottom:8px">'+
'<select id="ur" '+(self?'disabled':'')+' onchange="uRole(this.value)" style="margin-bottom:8px"><option value="staff"'+(u.role==='staff'?' selected':'')+'>کاشێر (ب ڕێپێدانان)</option><option value="owner"'+(u.role==='owner'?' selected':'')+'>خودان (هەمی ڕێپێدان)</option></select>'+
'<input id="up" type="password" inputmode="numeric" placeholder="'+(nu?'PIN (٤ پیت/ژمارە و پتر)':'PINی نوی (چۆل = نەگۆڕین)')+'" autocomplete="new-password" style="margin-bottom:8px">'+
'<div id="pb" style="display:'+(u.role==='owner'?'none':'')+'"><b>ڕێپێدان (ئەڤ کاشێرە دشێت):</b><div class="chips" style="margin:8px 0">'+Object.keys(PRESETS).map(k=>'<button type="button" onclick="uPreset(\''+k+'\')">'+PRESETS[k].n+'</button>').join('')+'</div>'+PERMS.map(p=>'<label class="pl"><input type="checkbox" id="pm_'+p[0]+'" '+((u.perms&&u.perms[p[0]])?'checked':'')+' style="width:auto"> '+p[1]+'</label>').join('')+'</div>'+
(self?'':'<label class="pl"><input type="checkbox" id="ua" '+(u.active!==false?'checked':'')+' style="width:auto"> چالاکە (دشێت بچیتە ژوور)</label>')+
'<div class="row" style="margin-top:10px"><button class="btn" onclick="uSave()">پاشەکەفتکرن</button><button class="btn g" onclick="uCancel()">ڕاکرن</button>'+((nu||self)?'':'<button class="btn r" onclick="uDel()">ژێبرن</button>')+'</div></div>'}
async function uSave(){if(!isOwner())return deny();
const nu=ue==='new',u=nu?null:S.users.find(x=>x.id===ue);if(!nu&&!u)return;
const name=$('un').value.trim(),pin=$('up').value;
const role=(nu||u.id!==curU.id)?$('ur').value:u.role;
const active=$('ua')?$('ua').checked:true;
if(!name)return alert('ناڤ بنڤیسە');
if(S.users.some(x=>x!==u&&x.name.toLowerCase()===name.toLowerCase()))return alert('ئەڤ ناڤە بەری نوکە هەیە');
if((nu&&pin.length<4)||(pin&&pin.length<4))return alert('PIN دڤێت ٤ پیت/ژمارە و پتر بیت');
const perms={};if(role==='staff')PERMS.forEach(p=>{if($('pm_'+p[0]).checked)perms[p[0]]=true});
const others=S.users.filter(x=>x.role==='owner'&&x.active!==false&&x!==u).length;
if(u&&u.role==='owner'&&(role!=='owner'||!active)&&others<1)return alert('دڤێت ژ یەک خودانێ چالاک کێمتر نەبیت');
if(nu){const salt=rndHex(16);S.users.push({id:'u'+Date.now(),name,role,perms,active,salt,hash:await hp(pin,salt),created:Date.now()});logA('ئەندامەکێ نوی: '+name+' ('+(role==='owner'?'خودان':'کاشێر')+')')}
else{if(pin){u.salt=rndHex(16);u.hash=await hp(pin,u.salt)}u.name=name;u.role=role;u.perms=perms;u.active=active;logA('گۆڕینا ئەندامی: '+name+(pin?' (PIN)':''))}
save();ue=null;render()}
function uDel(){const u=S.users.find(x=>x.id===ue);if(!isOwner()||!u||u.id===curU.id)return;
if(u.role==='owner'&&S.users.filter(x=>x.role==='owner'&&x.active!==false&&x!==u).length<1)return alert('دڤێت ژ یەک خودانێ چالاک کێمتر نەبیت');
if(!confirm('ئەرێ '+u.name+' ژێببەم؟'))return;S.users=S.users.filter(x=>x!==u);logA('ژێبرنا ئەندامی: '+u.name);save();ue=null;render()}
function setLock(v){if(!isOwner())return;S.lockMin=parseInt(v)||0;logA('قفلکرنا ب خۆکار: '+(S.lockMin||'نەچالاک'));save(true)}
async function newRec(){if(!isOwner())return;if(!confirm('کۆدا کۆن دێ چیت. بەردەوام؟'))return;const code=newRecCode(),rsalt=rndHex(16);S.rec={salt:rsalt,hash:await hp(normRec(code),rsalt)};recShow=code;logA('کۆدەکێ نوی بۆ ڤەگەڕاندنا PIN');save(true);render()}
try{if(document.addEventListener){['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},true));setInterval(()=>{const lk=S.lockMin==null?10:S.lockMin;if(curU&&lk>0&&Date.now()-lastAct>lk*60000)logout()},10000)}}catch(e){}

boot();
</script>
</body>
